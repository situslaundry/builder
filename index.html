<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <base href="/builder/">
  <title>Bandar Builder - Landing Page Engine</title>
  
  <!-- SEO & OpenGraph Placeholder -->
  <meta name="description" id="meta-desc" content="Platform Pembuat Landing Page Bisnis & UMKM">
  <meta property="og:type" content="website">
  <meta property="og:title" id="og-title" content="Bandar Builder">
  <meta property="og:description" id="og-desc" content="Platform Pembuat Landing Page Bisnis & UMKM">
  <meta property="og:image" id="og-image" content="">

  <link rel="stylesheet" href="./style.css">
  <script>
    (function(l) {
      if (l.search[1] === '/' ) {
        var decoded = l.search.slice(1).split('&').map(function(s) { 
          return s.replace(/~and~/g, '&')
        }).join('?');
        window.history.replaceState(null, null,
            l.pathname.slice(0, -1) + decoded + l.hash
        );
      }
    }(window.location));
  </script>
</head>
<body>
  <!-- Container untuk Toast Notifications & Modals -->
  <div id="toast-container"></div>
  <div id="modal-container"></div>

  <div id="navbar-container"></div>
  <main id="app" class="container"></main>

  <script type="module" src="./firebase-config.js"></script>
  <script type="module" src="./app.js"></script>
</body>
</html>
